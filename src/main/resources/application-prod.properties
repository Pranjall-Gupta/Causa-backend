# ===================================================================
# Production Profile Configuration
# ===================================================================

# Heroku & Cloud dynamic port binding ($PORT provided by Heroku runtime)
server.port=${PORT:5000}

# Database Configuration (Production fallback to local file DB or cloud DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/causadb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Security: Disable H2 Web Console in Production
spring.h2.console.enabled=false

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging settings for Production
logging.level.root=INFO
logging.level.com.causa=INFO
logging.level.org.springframework.web=WARN

# LLM / Fix Suggestion Service Configuration (Injected via Heroku Config Vars)
causa.llm.provider=azure-foundry
causa.llm.azure.endpoint=${AZURE_AI_FOUNDRY_ENDPOINT:https://causa01.cognitiveservices.azure.com}
causa.llm.azure.deployment-name=${AZURE_AI_FOUNDRY_DEPLOYMENT_NAME:gpt-5-mini}
causa.llm.azure.api-key=${AZURE_AI_FOUNDRY_API_KEY:}
causa.llm.azure.api-version=${AZURE_AI_FOUNDRY_API_VERSION:2024-12-01-preview}
