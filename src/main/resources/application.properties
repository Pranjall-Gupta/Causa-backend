# Dynamic Port (Heroku injects PORT env variable, defaults to 5000 locally)
server.port=${PORT:5000}

# Active Profile set to production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/causadb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Web Console configuration (Secure defaults)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Hibernate DDL Auto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# LLM / Fix Suggestion Service Configuration
causa.llm.provider=azure-foundry
causa.llm.azure.endpoint=${AZURE_AI_FOUNDRY_ENDPOINT:https://causa01.cognitiveservices.azure.com}
causa.llm.azure.deployment-name=gpt-5-mini
causa.llm.azure.api-key=${AZURE_AI_FOUNDRY_API_KEY:}
causa.llm.azure.api-version=2024-12-01-preview

